# Nginx site config for OneChainWEBV2 (STP public server).
# Proxies to FRP remote port 33450 → minipc:3450
#
# On server:
#   sudo cp nginx-onechainwebv2.conf /etc/nginx/sites-available/onechainwebv2.ai-rwa.xyz
#   sudo ln -sf /etc/nginx/sites-available/onechainwebv2.ai-rwa.xyz /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d onechainwebv2.ai-rwa.xyz

server {
    listen 80;
    server_name onechainwebv2.ai-rwa.xyz;

    location / {
        proxy_pass http://127.0.0.1:33450;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
