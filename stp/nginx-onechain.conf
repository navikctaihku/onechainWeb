# Nginx site config for OneChain static website.
# Install on server:
#   sudo cp nginx-onechain.conf /etc/nginx/sites-available/onechain.yourdomain.com
#   sudo ln -sf /etc/nginx/sites-available/onechain.yourdomain.com /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d onechain.yourdomain.com

server {
    listen 80;
    server_name onechainwebsitemockup.ai-rwa.xyz;

    root /var/www/onechain;
    index index.html;

    # Static site — try file, then .html, then index
    location / {
        try_files $uri $uri/ $uri.html /index.html;
    }

    # Cache assets (videos, images, js, css)
    location ~* \.(mp4|jpg|jpeg|png|webp|svg|ico|js|css|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Security headers
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
    add_header Referrer-Policy strict-origin-when-cross-origin;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;
}
